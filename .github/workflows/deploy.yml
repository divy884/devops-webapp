name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Starting build..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully."

      - name: Test
        run: |
          echo "Running tests..."
          test -f build/index.html
          grep -q "Hello DevOps CI/CD" build/index.html
          echo "All tests passed."

      - name: Generate output logs
        run: |
          echo "CI Pipeline completed successfully."
          echo "Build and test stages completed."

      - name: Deploy
        run: |
          echo "Deploying web application..."
          echo "Deployment successful!"
